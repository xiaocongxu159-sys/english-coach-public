project_id = "english-coach"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

# Supabase CLI 2.116 warns that [inbucket] is deprecated in favor of
# [local_smtp], but the hosted Branching config parser currently has a known
# compatibility gap with [local_smtp]. Keep the disabled legacy section until
# the hosted parser catches up; see docs/ISSUES_AND_SOLUTIONS.md ISSUE-011.
[inbucket]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
